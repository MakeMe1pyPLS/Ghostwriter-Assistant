<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ChainInsideIQ — Find the bottleneck. Fix it together.</title>
    <meta name="description" content="AI business analyst: growth plans, bottleneck detection and partner collaboration for businesses of every size." />
    <meta name="theme-color" content="#F4F7FA" />
    <script>
      // Apply the saved (or device) theme before first paint — no flash.
      (function () {
        try {
          var t = localStorage.getItem('ciq_theme');
          if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
        } catch (e) {}
      })();
      // First homepage visit: paint the intro's ink and dot grid while the app loads,
      // so loading flows straight into the intro (see components/IntroSplash.tsx).
      (function () {
        try {
          if (location.pathname === '/' && !/[?&]nointro\b/.test(location.search) &&
              localStorage.getItem('ciq_intro_seen_v3') !== '1' &&
              !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.dataset.intro = '1';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html[data-intro] body { background: #070C16 radial-gradient(circle, rgba(148,163,184,0.16) 1.2px, transparent 1.5px) 0 0 / 28px 28px; }
      html[data-intro] #root { visibility: hidden; }
    </style>

    <meta property="og:title" content="ChainInsideIQ" />
    <meta property="og:description" content="AI business analyst: growth plans, bottleneck detection and partner collaboration for businesses of every size." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AtomBSA" />
    <meta name="twitter:creator" content="@AtomBSA" />
    <meta name="twitter:title" content="ChainInsideIQ" />
    <meta name="twitter:description" content="AI business analyst: growth plans, bottleneck detection and partner collaboration for businesses of every size." />
    <meta name="twitter:image" content="/opengraph.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
